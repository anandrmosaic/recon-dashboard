        <div style="font-size:10px;font-weight:700;color:#e65100;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">📋 Filed — Pending Approval</div>
        <div style="font-size:32px;font-weight:800;color:#e65100;line-height:1">${filedPending.length}</div>
        <div style="font-size:11px;color:#888;margin-top:4px">Form received · awaiting UPS decision</div>
      </div>
      <div style="background:#fff8e1;border-radius:12px;padding:14px;border:1px solid #ffe082;border-left:5px solid #f9a825">
        <div style="font-size:10px;font-weight:700;color:#f57f17;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">🟡 Approved — Pending Transfer</div>
        <div style="font-size:32px;font-weight:800;color:#f57f17;line-height:1">${approvedNotSettled.length}</div>
        <div style="font-size:11px;color:#888;margin-top:4px">Claim approved · UTR not received yet</div>
        <div style="font-size:13px;font-weight:700;color:#f57f17;margin-top:4px">₹${_upsTotApproved.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
      </div>
      <div style="background:#f0fdf4;border-radius:12px;padding:14px;border:1px solid #c8e6c9;border-left:5px solid #2e7d32">
        <div style="font-size:10px;font-weight:700;color:#2e7d32;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">✅ Settled — UTR Received</div>
        <div style="font-size:32px;font-weight:800;color:#2e7d32;line-height:1">${settledClaims.length} <span style="font-size:13px;font-weight:500;color:#888">AWBs</span></div>
        <div style="font-size:14px;font-weight:700;color:#2e7d32;margin-top:4px">₹${_upsTotSettled.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">SCBLH UTR confirmed · ${summ.total_awbs || 0} total lost</div>
      </div>
      <div style="background:#fff8f8;border-radius:12px;padding:14px;border:1px solid #ef9a9a;border-left:5px solid #b71c1c">
        <div style="font-size:10px;font-weight:700;color:#b71c1c;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">🚫 Claim Declined</div>
        <div style="font-size:32px;font-weight:800;color:#b71c1c;line-height:1">${declinedClaims.length}</div>
        <div style="font-size:11px;color:#888;margin-top:4px">Delivered as per UPS — not applicable</div>
        <div style="font-size:11px;color:#b71c1c;margin-top:6px;font-weight:600">No recovery expected</div>
      </div>
    </div>`;

  // ── View toggle ────────────────────────────────────────────────────
  const views = [
    { key: 'all',                  label: 'All Claims',                count: claims.length,             col: '#1a237e' },
    { key: 'settled',              label: '✅ Settled (UTR)',          count: settledClaims.length,      col: '#2e7d32' },
    { key: 'approved_not_settled', label: '🟡 Approved — Pending',    count: approvedNotSettled.length, col: '#f57f17' },
    { key: 'filed_pending',        label: '📋 Filed — Pending',       count: filedPending.length,       col: '#e65100' },
    { key: 'declined',             label: '🚫 Declined',              count: declinedClaims.length,     col: '#b71c1c' },
  ];
  let upsView = window._upsView || 'all';
  window._upsView = upsView;

  const toggleBtns = views.map(v => {
    const active = upsView === v.key;
    return `<button onclick="window._upsView='${v.key}';applyAndRender()" style="padding:6px 16px;border-radius:20px;border:2px solid ${active ? v.col : '#ddd'};background:${active ? v.col : '#fff'};color:${active ? '#fff' : '#666'};font-size:12px;font-weight:600;cursor:pointer">
      ${v.label} <span style="background:${active ? 'rgba(255,255,255,0.25)' : '#f0f0f0'};color:${active ? '#fff' : '#666'};padding:1px 8px;border-radius:10px;margin-left:4px">${v.count}</span>
    </button>`;
  }).join('');

  const viewDisp = upsView === 'settled'              ? settledClaims
                 : upsView === 'approved_not_settled' ? approvedNotSettled
                 : upsView === 'filed_pending'        ? filedPending
                 : upsView === 'declined'             ? declinedClaims
                 : claims;

  // ── Table ──────────────────────────────────────────────────────────
  const stateTag = s => {
    if (s === 'settled')              return '<span style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">✅ Settled</span>';
    if (s === 'approved_not_settled') return '<span style="background:#fff8e1;color:#f57f17;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">🟡 Approved</span>';
    if (s === 'filed_pending')        return '<span style="background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">📋 Filed</span>';
    if (s === 'declined')             return '<span style="background:#fce4ec;color:#b71c1c;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">🚫 Declined</span>';
    return '<span style="background:#ffebee;color:#c62828;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">🔴 Not Filed</span>';
  };

  const tableRows = viewDisp.map((c, i) => `
    <tr style="background:${i%2===0?'#fff':'#fafafa'}">
      <td style="padding:8px 10px;font-size:11px;color:#666;font-weight:600">${c.parent_awb || '—'}</td>
      <td style="padding:8px 10px;font-weight:600;font-size:12px">${c.lost_awb || '—'}</td>
      <td style="padding:8px 10px;text-align:center">${c.lost_qty || '—'}</td>
      <td style="padding:8px 10px;text-align:center;font-weight:600;color:${c.claim_amount ? '#2e7d32' : '#ccc'}">${c.claim_amount || '—'}</td>
      <td style="padding:8px 10px;text-align:center;font-size:11px">${c.form_received || '—'}</td>
      <td style="padding:8px 10px;text-align:center;font-size:11px">${c.approved_date || '—'}</td>
      <td style="padding:8px 10px;text-align:center;font-size:11px">${c.settled_date || '—'}</td>
      <td style="padding:8px 10px;text-align:center">${stateTag(c.state)}</td>
      <td style="padding:8px 10px;font-size:11px;color:${c.state==='declined'?'#b71c1c':'#777'};max-width:200px;word-break:break-word">${c.remark || '—'}</td>
    </tr>`).join('');

  const emptyRow = viewDisp.length === 0
    ? '<tr><td colspan="9" style="text-align:center;padding:40px;color:#aaa">No records found.</td></tr>' : '';

  document.getElementById('mainContent').innerHTML = `
    ${summaryCards}
    ${upsMonthTable}
    <div style="padding:12px 20px 0;display:flex;gap:8px;flex-wrap:wrap">${toggleBtns}</div>
    <div style="padding:12px 20px 20px">
      <div style="background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid #e0e0e0;overflow:hidden">
        <div style="padding:12px 16px;font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #f0f0f0">
          <i class="fas fa-list-alt" style="color:#1a237e"></i>&nbsp; UPS Claims — ${viewDisp.length} records
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr style="background:#1a237e;color:#fff">
              <th style="padding:8px 10px;text-align:left;white-space:nowrap">Parent AWB</th>
              <th style="padding:8px 10px;text-align:left;white-space:nowrap">Lost AWB</th>
              <th style="padding:8px 10px;text-align:center">Lost Qty</th>
              <th style="padding:8px 10px;text-align:center">Claim Amount (₹)</th>
              <th style="padding:8px 10px;text-align:center;white-space:nowrap">Claim Form Received</th>
              <th style="padding:8px 10px;text-align:center;white-space:nowrap">Approved Date</th>
              <th style="padding:8px 10px;text-align:center;white-space:nowrap">Settled Date</th>
              <th style="padding:8px 10px;text-align:center">Status</th>
              <th style="padding:8px 10px;text-align:left">Remark / Notes</th>
            </tr></thead>
            <tbody>${tableRows}${emptyRow}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function renderDiscrepancyTab(data, lastUpdated) {
  _discTabData    = data;
  _discTabUpdated = lastUpdated;
  destroyCharts();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + lastUpdated;

  const allDisc        = data.discrepancies || [];
  const needsActionDisc = allDisc.filter(d => !d.is_closed && !d.case_raise_date);
  const inProgressDisc  = allDisc.filter(d => !d.is_closed && d.case_raise_date);
  const resolvedDisc    = allDisc.filter(d => d.is_closed);
  const baseDisc = _discView === 'resolved'    ? resolvedDisc
                 : _discView === 'in_progress' ? inProgressDisc
                 : needsActionDisc;
  // Apply column filters (Options A+C)
  const disc = baseDisc.filter(d =>
    (!_discFilters.month        || d.month === _discFilters.month) &&
    (!_discFilters.channel      || d.channel === _discFilters.channel) &&
    (!_discFilters.transporter  || (d.transporter||'') === _discFilters.transporter) &&
    (!_discFilters.reimb_status || d.reimbursement_status === _discFilters.reimb_status) &&
    (!_discFilters.ship_status  || (d.ship_partner_status||'') === _discFilters.ship_status)
  );

  // Update badge count on tab — show only needs-action count
  const badge = document.getElementById('discBadge');
  badge.textContent = needsActionDisc.length;
  badge.style.display = needsActionDisc.length > 0 ? 'inline' : 'none';

  // Per-channel counts
  const channelColors = {
    Amazon: { border: '#1565c0', icon: 'blue', fa: 'fa-amazon' },
    Shipbob: { border: '#2e7d32', icon: 'green', fa: 'fa-box' },
    TikTok: { border: '#ad1457', icon: 'pink', fa: 'fa-music' },
    Sky2C: { border: '#6a1b9a', icon: 'purple', fa: 'fa-globe' },
    Other: { border: '#757575', icon: 'grey', fa: 'fa-ellipsis-h' },
  };
  const iconBg = { blue:'#e3f2fd', green:'#e8f5e9', pink:'#fce4ec', purple:'#f3e5f5', grey:'#f5f5f5' };
  const iconColor = { blue:'#1565c0', green:'#2e7d32', pink:'#ad1457', purple:'#6a1b9a', grey:'#757575' };

  const countByChannel = {};
  const pendingByChannel = {};
  disc.forEach(d => {
    countByChannel[d.channel] = (countByChannel[d.channel] || 0) + 1;
    pendingByChannel[d.channel] = (pendingByChannel[d.channel] || 0) + (d.pending || 0);
  });

  const summaryCards = Object.entries(countByChannel).sort((a,b) => b[1]-a[1]).map(([ch, cnt]) => {
    const cfg = channelColors[ch] || { border: '#9e9e9e', icon: 'grey', fa: 'fa-store' };
    const bg = iconBg[cfg.icon] || '#f5f5f5';
    const col = iconColor[cfg.icon] || '#757575';
    const pend = pendingByChannel[ch] || 0;
    return `
      <div class="disc-channel-card" style="border-color:${cfg.border}">
        <div class="disc-icon" style="background:${bg};color:${col}"><i class="fas ${cfg.fa}"></i></div>
        <div>
          <div class="disc-count" style="color:${cfg.border}">${cnt}</div>
          <div class="disc-label">${ch}</div>
          <div class="disc-sublabel">Pending: ${formatUSD(pend)}</div>
        </div>
      </div>`;
  }).join('');

  const totalCard = `
    <div class="disc-channel-card" style="border-color:#c62828;margin-left:auto">
      <div class="disc-icon" style="background:#ffebee;color:#c62828"><i class="fas fa-exclamation-triangle"></i></div>
      <div>
        <div class="disc-count" style="color:#c62828">${disc.length}</div>
        <div class="disc-label">Total Discrepancies</div>
        <div class="disc-sublabel">Across all channels</div>
      </div>
    </div>`;

  // Unique values for column filter dropdowns
  const uniq = (arr, key) => [...new Set(arr.map(d => d[key]||'').filter(Boolean))].sort();
  const uMonths    = uniq(baseDisc, 'month');
  const uChannels  = uniq(baseDisc, 'channel');
  const uTransport = uniq(baseDisc, 'transporter');
  const uStatuses  = uniq(baseDisc, 'reimbursement_status');
  const uShipSt    = uniq(baseDisc, 'ship_partner_status');

  // Ship partner status badge
  const shipStatusBadge = s => {
    if (!s) return '<span style="color:#aaa">—</span>';
    const sl = s.toLowerCase();
    const [bg, col] = sl.includes('receiv') ? ['#fff7ed','#c2410c']
                    : sl.includes('deliver') ? ['#f0fdf4','#16a34a']
                    : sl.includes('transit') ? ['#eff6ff','#2563eb']
                    : sl.includes('close')   ? ['#f0fdf4','#16a34a']
                    : ['#f5f5f5','#555'];
    return `<span style="background:${bg};color:${col};border:1px solid ${col}30;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap">${s}</span>`;
  };

  const hasFilters = Object.values(_discFilters).some(v => v);
  const mkOpts = (vals, key) => vals.map(v =>
    `<option value="${v}" ${_discFilters[key]===v?'selected':''}>${v}</option>`).join('');
  const selStyle = `border:1px solid #ddd;border-radius:6px;padding:4px 8px;font-size:11px;
    background:#fff;cursor:pointer;min-width:100px`;

  const filterBar = `
    <div style="padding:8px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
      background:#f8fafc;border-top:1px solid #e8ecf0;border-bottom:1px solid #e8ecf0">
      <span style="font-size:11px;font-weight:700;color:#666;white-space:nowrap">
        <i class="fas fa-filter" style="color:#1a237e"></i> FILTERS:
      </span>
      <select id="discFilter_month" style="${selStyle}" onchange="setColFilter('month',this.value)">
        <option value="">All Months</option>${mkOpts(uMonths,'month')}
      </select>
      <select id="discFilter_channel" style="${selStyle}" onchange="setColFilter('channel',this.value)">
        <option value="">All Channels</option>${mkOpts(uChannels,'channel')}
      </select>
      <select id="discFilter_transporter" style="${selStyle}" onchange="setColFilter('transporter',this.value)">
        <option value="">All Transporters</option>${mkOpts(uTransport,'transporter')}
      </select>
      <select id="discFilter_reimb_status" style="${selStyle}" onchange="setColFilter('reimb_status',this.value)">
        <option value="">All Statuses</option>${mkOpts(uStatuses,'reimb_status')}
      </select>
      <select id="discFilter_ship_status" style="${selStyle}" onchange="setColFilter('ship_status',this.value)">
        <option value="">All Shipment Status</option>${mkOpts(uShipSt,'ship_status')}
      </select>
      ${hasFilters ? `<button onclick="clearAllFilters()" style="padding:4px 12px;border-radius:6px;
        border:1px solid #ef4444;background:#fef2f2;color:#ef4444;font-size:11px;font-weight:600;cursor:pointer">
        ✕ Clear All</button>
        <span style="font-size:11px;color:#1a237e;font-weight:600">${disc.length}/${baseDisc.length} rows</span>` : ''}
    </div>`;

  // Sort disc table if a sort col is active (must be before tableRows)
  const sortedDisc = _discSortCol ? [...disc].sort((a, b) => {
    let av = a[_discSortCol] ?? '', bv = b[_discSortCol] ?? '';
    if (typeof av === 'string') av = av.toLowerCase(), bv = bv.toLowerCase();
    return av < bv ? -_discSortDir : av > bv ? _discSortDir : 0;
  }) : disc;

  // Table rows
  const statusBadge = s => {
    if (!s) return '<span class="badge-status-na">—</span>';
    const l = s.toLowerCase();
    if (l.includes('close') || l.includes('reimb') || l.includes('done')) return `<span class="badge-status-closed">${s}</span>`;
    if (l.includes('open') || l.includes('pend') || l.includes('progress')) return `<span class="badge-status-open">${s}</span>`;
    return `<span class="badge-status-na">${s}</span>`;
  };

  const agingBadge = (bucket, days, isClosed, daysToClose) => {
    if (isClosed) {
      if (daysToClose != null) {
        const col = daysToClose <= 30 ? '#2e7d32' : daysToClose <= 60 ? '#f57f17' : daysToClose <= 90 ? '#e65100' : '#c62828';
        const bg  = daysToClose <= 30 ? '#e8f5e9' : daysToClose <= 60 ? '#fff8e1' : daysToClose <= 90 ? '#fff3e0' : '#ffebee';
        return `<span style="background:${bg};color:${col};padding:2px 8px;border-radius:50px;font-size:11px;font-weight:600;white-space:nowrap">✓ ${daysToClose}d to close</span>`;
      }
      return `<span class="badge-status-closed">Closed</span>`;
    }
    if (!bucket) return '<span class="badge-aging-na">No date</span>';
    const label = days != null ? `${bucket} (${days}d)` : bucket;
    if (bucket === '0-30 days')  return `<span class="badge-aging-fresh">${label}</span>`;
    if (bucket === '31-60 days') return `<span class="badge-aging-aging">${label}</span>`;
    if (bucket === '61-90 days') return `<span class="badge-aging-overdue">${label}</span>`;
    if (bucket === '90+ days')   return `<span class="badge-aging-critical">${label}</span>`;
    return `<span class="badge-aging-na">${label}</span>`;
  };

  const tableRows = sortedDisc.map((d, idx) => `
    <tr class="disc-row" data-ch="${d.channel}" data-awb="${d.awb.toLowerCase()}" data-month="${d.month.toLowerCase()}" data-row="${d.row_index||''}" data-status="${(d.reimbursement_status||'').replace(/"/g,'&quot;')}" data-actual="${d.actual_reimbursed||0}" data-lost="${d.lost_stock||0}" data-raise="${d.case_raise_date||''}" data-close="${d.case_close_date||''}" data-remark="${(d.remark||'').replace(/"/g,'&quot;')}">
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#666">${d.month}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#0369a1;font-weight:500">${d.actual_delivery_date || '<span style="color:#aaa">—</span>'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0">${shipStatusBadge(d.ship_partner_status)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:12px">${d.awb || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0">${d.platform_label || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0">${d.channel}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0">${d.transporter || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px;max-width:160px">${d.product_name || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px">${d.uniware_code || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px">${d.invoice_no || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:center">${formatNum(d.qty_sent)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:center"><span class="badge-lost">${formatNum(d.lost_stock)}</span></td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:center">${formatUSD(d.expected_reimburs)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:center"><span class="badge-recovered">${formatUSD(d.actual_reimbursed)}</span></td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:center"><span class="badge-pending">${formatUSD(d.pending)}</span></td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0">${statusBadge(d.reimbursement_status)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0">${agingBadge(d.aging_bucket, d.days_open, d.is_closed, d.days_to_close)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#666;max-width:180px">${d.remark || '—'}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:center">
        <button onclick="openEditModal('${d.awb}',this.closest('tr').dataset.status,this.closest('tr').dataset.actual,this.closest('tr').dataset.raise,this.closest('tr').dataset.close,this.closest('tr').dataset.remark,this.closest('tr').dataset.lost)"
          title="Edit this row in Google Sheet"
          style="background:none;border:1.5px solid #e2e8f0;border-radius:6px;padding:4px 8px;cursor:pointer;color:#64748b;font-size:12px;transition:all 0.15s"
          onmouseover="this.style.borderColor='#1b3a2d';this.style.color='#1b3a2d'"
          onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b'">
          ✏️
        </button>
      </td>
    </tr>`).join('');

  const emptyRow = disc.length === 0
    ? `<tr><td colspan="19" style="text-align:center;padding:40px;color:#aaa">${_discView === 'resolved' ? 'No resolved shipments yet.' : _discView === 'in_progress' ? 'No cases in progress.' : hasFilters ? 'No rows match the current filters.' : 'No unactioned discrepancies — all cases have been raised! ✅'}</td></tr>`
    : '';

  const totQty      = disc.reduce((s,d) => s + (d.qty_sent||0), 0);
  const totLost     = disc.reduce((s,d) => s + (d.lost_stock||0), 0);
  const totExpected = disc.reduce((s,d) => s + (d.expected_reimburs||0), 0);
  const totRecov    = disc.reduce((s,d) => s + (d.actual_reimbursed||0), 0);
  const totPending  = disc.reduce((s,d) => s + (d.pending||0), 0);
  const summaryRow  = disc.length === 0 ? '' : `
    <tr style="background:#f0f4ff;font-weight:700;border-top:2px solid #c5cae9">
      <td style="padding:8px 10px;color:#1a237e;font-size:12px" colspan="2">TOTAL (${disc.length} rows)</td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px;text-align:center;color:#1a237e">${formatNum(totQty)}</td>
      <td style="padding:8px 10px;text-align:center"><span class="badge-lost">${formatNum(totLost)}</span></td>
      <td style="padding:8px 10px;text-align:center;color:#1a237e">${formatUSD(totExpected)}</td>
      <td style="padding:8px 10px;text-align:center"><span class="badge-recovered">${formatUSD(totRecov)}</span></td>
      <td style="padding:8px 10px;text-align:center"><span class="badge-pending">${formatUSD(totPending)}</span></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
      <td style="padding:8px 10px"></td>
    </tr>`;

  const closedCount = resolvedDisc.length;
  const resPct = allDisc.length > 0 ? Math.round(closedCount / allDisc.length * 100) : 0;

  const viewToggle = `
    <div style="display:flex;gap:8px;padding:12px 24px 0;flex-wrap:wrap">
      <button onclick="switchDiscView('needs_action')" style="padding:7px 18px;border-radius:20px;border:2px solid ${_discView==='needs_action'?'#c62828':'#ddd'};background:${_discView==='needs_action'?'#c62828':'#fff'};color:${_discView==='needs_action'?'#fff':'#666'};font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s">
        🔴 Needs Action <span style="background:${_discView==='needs_action'?'rgba(255,255,255,0.25)':'#ffebee'};color:${_discView==='needs_action'?'#fff':'#c62828'};padding:1px 8px;border-radius:10px;margin-left:4px;font-weight:700">${needsActionDisc.length}</span>
      </button>
      <button onclick="switchDiscView('in_progress')" style="padding:7px 18px;border-radius:20px;border:2px solid ${_discView==='in_progress'?'#e65100':'#ddd'};background:${_discView==='in_progress'?'#e65100':'#fff'};color:${_discView==='in_progress'?'#fff':'#666'};font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s">
        🟡 In Progress <span style="background:${_discView==='in_progress'?'rgba(255,255,255,0.25)':'#fff8e1'};color:${_discView==='in_progress'?'#fff':'#e65100'};padding:1px 8px;border-radius:10px;margin-left:4px;font-weight:700">${inProgressDisc.length}</span>
      </button>
      <button onclick="switchDiscView('resolved')" style="padding:7px 18px;border-radius:20px;border:2px solid ${_discView==='resolved'?'#2e7d32':'#ddd'};background:${_discView==='resolved'?'#2e7d32':'#fff'};color:${_discView==='resolved'?'#fff':'#666'};font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s">
        ✅ Resolved / Archived <span style="background:${_discView==='resolved'?'rgba(255,255,255,0.25)':'#e8f5e9'};color:${_discView==='resolved'?'#fff':'#2e7d32'};padding:1px 8px;border-radius:10px;margin-left:4px;font-weight:700">${resolvedDisc.length}</span>
      </button>
    </div>`;

  document.getElementById('mainContent').innerHTML = `
    <div class="disc-summary">${summaryCards}${totalCard}</div>

    <div style="padding:10px 24px 0">
      <div class="resolution-bar-wrap">
        <div style="white-space:nowrap;font-size:12px;font-weight:600;color:var(--text-muted)">
          <i class="fas fa-tasks me-1" style="color:var(--primary)"></i>
          Resolution Progress
        </div>
        <div class="resolution-bar-track">
          <div class="resolution-bar-fill" style="width:${resPct}%"></div>
        </div>
        <div style="white-space:nowrap;font-size:12px;font-weight:700;color:var(--primary)">${closedCount}/${allDisc.length} <span style="font-weight:400;color:var(--text-muted)">(${resPct}%)</span></div>
      </div>
    </div>

    ${viewToggle}
    ${filterBar}

    <div class="disc-table-wrap">
      <div class="disc-table-card">
        <div class="table-title" style="display:flex;justify-content:space-between;align-items:center">
          <span><i class="fas fa-list-alt" style="color:var(--navy)"></i> &nbsp;${_discView === 'resolved' ? 'Resolved / Archived Shipments' : _discView === 'in_progress' ? 'In Progress — Cases Being Chased' : 'Needs Action — No Case Raised Yet'}</span>
          <div style="display:flex;gap:8px;align-items:center">
            <input class="disc-search" id="discSearch" placeholder="Search AWB, channel, transporter..." oninput="filterDiscTable(this.value)">
            <button class="btn-export" onclick="exportDiscrepancy()" style="white-space:nowrap">
              <i class="fas fa-file-excel"></i> Export Excel
            </button>
          </div>
        </div>
        <div class="disc-table-scroll">
        <table class="recon-table" id="discTable">
          <thead>
            <tr>
              ${[
                ['month','Month','month',uMonths],
                ['actual_delivery_date','Delivery Date',null,[]],
                ['ship_partner_status','Shipment Status','ship_status',uShipSt],
                ['awb','Shipment AWB',null,[]],
                ['platform_label','IBR / Label',null,[]],
                ['channel','Channel','channel',uChannels],
                ['transporter','Transporter','transporter',uTransport],
                ['product_name','Product Name',null,[]],
                ['uniware_code','Uniware Code',null,[]],
                ['invoice_no','Invoice No',null,[]],
              ].map(([col,lbl,fKey,fVals]) => {
                const isFiltered = fKey && _discFilters[fKey];
                const filterIcon = fKey ? `<span onclick="event.stopPropagation();showColFilter('${fKey}',${JSON.stringify(fVals)},this)"
                  style="margin-left:4px;cursor:pointer;color:${isFiltered?'#1a237e':'#aaa'};font-size:10px"
                  title="Filter ${lbl}">▾</span>` : '';
                return `<th class="sortable-th" onclick="sortDisc('${col}')" style="padding:8px 10px;background:${isFiltered?'#e8eaf6':''}">
                  ${lbl}<span class="sort-icon">${_discSortCol===col?(_discSortDir===1?'▲':'▼'):'⇅'}</span>${filterIcon}</th>`;
              }).join('')}
              <th style="padding:8px 10px;text-align:center">Qty Sent</th>
              <th class="sortable-th" onclick="sortDisc('lost_stock')" style="padding:8px 10px;text-align:center">Lost Units<span class="sort-icon">${_discSortCol==='lost_stock'?(_discSortDir===1?'▲':'▼'):'⇅'}</span></th>
              <th class="sortable-th" onclick="sortDisc('expected_reimburs')" style="padding:8px 10px;text-align:center">Expected ($)<span class="sort-icon">${_discSortCol==='expected_reimburs'?(_discSortDir===1?'▲':'▼'):'⇅'}</span></th>
              <th class="sortable-th" onclick="sortDisc('actual_reimbursed')" style="padding:8px 10px;text-align:center">Recovered ($)<span class="sort-icon">${_discSortCol==='actual_reimbursed'?(_discSortDir===1?'▲':'▼'):'⇅'}</span></th>
              <th class="sortable-th" onclick="sortDisc('pending')" style="padding:8px 10px;text-align:center">Pending ($)<span class="sort-icon">${_discSortCol==='pending'?(_discSortDir===1?'▲':'▼'):'⇅'}</span></th>
              <th class="sortable-th" onclick="sortDisc('reimbursement_status')" style="padding:8px 10px">Reimb. Status<span class="sort-icon">${_discSortCol==='reimbursement_status'?(_discSortDir===1?'▲':'▼'):'⇅'}</span></th>
              <th class="sortable-th" onclick="sortDisc('days_open')" style="padding:8px 10px">Aging<span class="sort-icon">${_discSortCol==='days_open'?(_discSortDir===1?'▲':'▼'):'⇅'}</span></th>
              <th style="padding:8px 10px">Remark</th>
              <th style="padding:8px 10px;text-align:center">Edit</th>
            </tr>
          </thead>
          <tbody>${tableRows}${emptyRow}${summaryRow}</tbody>
        </table>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-left">
        <i class="fas fa-info-circle me-1"></i>
        Showing shipments where Lost Stock &gt; 0. Filters (Channel, Month) apply above.
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-export" onclick="exportDiscrepancy()">
          <i class="fas fa-file-excel"></i> Export Excel
        </button>
        <button class="btn-email" onclick="sendTestEmail()">
          <i class="fas fa-paper-plane"></i> Send Report Email Now
        </button>
      </div>
    </div>
  `;
}

function filterDiscTable(q) {
  const rows = document.querySelectorAll('#discTable .disc-row');
  const s = q.toLowerCase();
  rows.forEach(r => {
    const text = r.dataset.awb + ' ' + r.dataset.ch + ' ' + r.dataset.month + ' ' + r.textContent.toLowerCase();
    r.style.display = text.includes(s) ? '' : 'none';
  });
}

function renderDashboard(data, lastUpdated) {
  destroyCharts();
  const trends = computeTrends(data);
  const kpis = data.kpis || {};
  const cd = data.channel_data || {};
  const td = data.transporter_data || {};
  const remarks = data.remarks || {};
  const months = cd.months || [];
  const channels = cd.channels || {};
  const transporters = td.transporters || {};
  const view = _filterState.view;
  const showChannel = view !== 'carrier';
  const showCarrier  = view !== 'channel';

  document.getElementById('lastUpdated').textContent = 'Updated: ' + lastUpdated;

  const colors = {
    Amazon: '#2563eb', Shipbob: '#1b3a2d', TikTok: '#c0392b',
    DHL: '#d97706', Freightzen: '#7c3aed', UPS: '#0891b2',
    'Xindus Air': '#b45309', 'Xindus Air + Sea': '#0f766e', 'Channel Freight': '#4d7c0f',
    Sky2C: '#6b7280', Other: '#9e9890'
  };

  // Recon discrepancies for Channel Summary (rendering scope)
  const _filtDisc    = data.discrepancies || [];
  const _discByMonth = {};
  _filtDisc.forEach(d => {
    if (!_discByMonth[d.month]) _discByMonth[d.month] = { lost:0, exp:0, act:0 };
    _discByMonth[d.month].lost += d.lost_stock        || 0;
    _discByMonth[d.month].exp  += d.expected_reimburs || 0;
    _discByMonth[d.month].act  += d.actual_reimbursed || 0;
  });
  // Add 2025 months from main sheet into _discByMonth
  months.forEach((m, mi) => {
    if (m.includes('2025')) {
      const g = (cd.grand_total || [])[mi] || {};
      if (!_discByMonth[m]) _discByMonth[m] = { lost:0, exp:0, act:0 };
      _discByMonth[m].lost += g.lost_stock        || 0;
      _discByMonth[m].exp  += g.expected_reimburs || 0;
      _discByMonth[m].act  += g.actual_reimbursed || 0;
    }
  });
  const _discActual   = Object.values(_discByMonth).reduce((s,v) => s + v.act, 0);
  const _discExpected = Object.values(_discByMonth).reduce((s,v) => s + v.exp, 0);
  const _discLost     = Object.values(_discByMonth).reduce((s,v) => s + v.lost, 0);

  // ── Channel Summary table rows — with per-channel lost bifurcation
  const chLostByMonth = (chName, i) => {
    const key = Object.keys(cd.channels || {}).find(k => k.toLowerCase().includes(chName.toLowerCase()));
    const row = key ? ((cd.channels[key] || [])[i] || {}) : {};
    return row.lost_stock || 0;
  };
  const chLostTotal = (chName) => {
    const key = Object.keys(cd.channels || {}).find(k => k.toLowerCase().includes(chName.toLowerCase()));
    if (!key) return 0;
    return (cd.channels[key] || []).reduce((s, r) => s + (r.lost_stock || 0), 0);
  };
  const channelMonthRows = months.map((m, i) => {
    const g    = (cd.grand_total || [])[i] || {};
    const dm   = _discByMonth[m]; // recon data for this month
    const mLost = dm ? dm.lost : (g.lost_stock        || 0);
    const mExp  = dm ? dm.exp  : (g.expected_reimburs || 0);
    const mAct  = dm ? dm.act  : (g.actual_reimbursed || 0);
    const pend  = mExp - mAct;
    const lAmz  = chLostByMonth('amazon', i);
    const lTT   = chLostByMonth('tiktok', i);
    const lSB   = chLostByMonth('shipbob', i);
    return `<tr>
      <td>${m}</td>
      <td>${formatNum(g.qty_sent)}</td>
      <td><span class="badge-lost">${lAmz > 0 ? formatNum(lAmz) : '<span style="color:#aaa">—</span>'}</span></td>
      <td><span class="badge-lost">${lTT  > 0 ? formatNum(lTT)  : '<span style="color:#aaa">—</span>'}</span></td>
      <td><span class="badge-lost">${lSB  > 0 ? formatNum(lSB)  : '<span style="color:#aaa">—</span>'}</span></td>
      <td><span class="badge-lost">${formatNum(mLost)}</span></td>
      <td>${formatUSD(mExp)}</td>
      <td><span class="badge-recovered">${formatUSD(mAct)}</span></td>
      <td><span class="badge-pending">${formatUSD(pend)}</span></td>
    </tr>`;
  }).join('');

  // ── Transporter $ aggregation — split carrier vs channel recovery
  const trMoney = {};
  (data.discrepancies || []).forEach(d => {
    if (!d.transporter) return;
    if (!trMoney[d.transporter]) trMoney[d.transporter] = { expected: 0, carrier: 0, channel: 0, pending: 0 };
    trMoney[d.transporter].expected += d.expected_reimburs  || 0;
    trMoney[d.transporter].carrier  += d.carrier_recovered  || 0;
    trMoney[d.transporter].channel  += d.channel_recovered  || 0;
    trMoney[d.transporter].pending  += d.pending            || 0;
  });

  // ── Transporter table rows
  const transporterRows = Object.entries(transporters).map(([name, rows]) => {
    const shipped = rows.reduce((s, r) => s + (r.qty_sent || 0), 0);
    const lost    = rows.reduce((s, r) => s + (r.lost_stock || 0), 0);
    const pct = shipped > 0 ? ((lost / shipped) * 100).toFixed(2) : '0.00';
    if (shipped === 0 && lost === 0) return '';
    const m = trMoney[name] || { expected: 0, carrier: 0, channel: 0, pending: 0 };
    const totalRecovered = m.carrier + m.channel;
    const carrierCell = m.carrier > 0
      ? `<span style="color:#0ea5e9;font-weight:600">${formatUSD(m.carrier)}</span>`
      : `<span style="color:#aaa">—</span>`;
    const channelCell = m.channel > 0
      ? `<span class="badge-recovered">${formatUSD(m.channel)}</span>`
      : `<span style="color:#aaa">—</span>`;
    return `<tr>
      <td>${name}</td>
      <td>${formatNum(shipped)}</td>
      <td><span class="badge-lost">${formatNum(lost)}</span></td>
      <td style="color:${lost > 0 ? 'var(--red)' : 'var(--green-val)'}">${pct}%</td>
      <td>${formatUSD(m.expected)}</td>
      <td>${carrierCell}</td>
      <td>${channelCell}</td>
      <td><span class="badge-recovered">${formatUSD(totalRecovered)}</span></td>
      <td><span class="badge-pending">${formatUSD(m.pending)}</span></td>
    </tr>`;
  }).join('');

  // ── Remarks (temporarily hidden)
  const remarksHTML = '';

  // ── Tables layout: single column when only one view
  const tablesClass = (showChannel && showCarrier) ? 'tables-grid' : 'tables-grid single';

  // ── Case Health Overview: unified aging + resolution (open-cases-only in buckets)
  let caseHealthHTML = '';
  try {
    const allDisc = data.discrepancies || [];

    // Pre-compute per-channel financial totals from channel_data (same source as KPI cards)
    // This guarantees Expected/Actual/Pending in the table always match the KPI numbers
    const chFinancials = {};
    const cdChannels = (data.channel_data || {}).channels || {};
    Object.keys(cdChannels).forEach(function(ch) {
      const months = cdChannels[ch];
      let exp = 0, act = 0;
      months.forEach(function(m) { exp += (m.expected_reimburs || 0); act += (m.actual_reimbursed || 0); });
      chFinancials[ch] = { expected: exp, actual: act, pending: exp - act };
    });
    if (allDisc.length > 0) {
      const openDisc     = allDisc.filter(function(d) { return !d.is_closed; });
      const closedDisc   = allDisc.filter(function(d) { return  d.is_closed; });
      const resolvedDisc = closedDisc.filter(function(d) { return !d.is_rejected; });
      const rejectedDisc = closedDisc.filter(function(d) { return  d.is_rejected; });

      const BUCKETS    = ['0-30 days', '31-60 days', '61-90 days', '90+ days'];
      const BKT_LABELS = ['0-30 Days', '31-60 Days', '61-90 Days', '90+ Days'];
      const BKT_COLORS = ['#2e7d32', '#f57f17', '#e65100', '#c62828'];
      const BKT_BG     = ['#e8f5e9', '#fff8e1', '#fff3e0', '#ffebee'];

      // Bucket totals — open cases only
      const bktTotals = {};
      BUCKETS.forEach(function(b) { bktTotals[b] = {count:0, pending:0}; });
      const noDateTot = {count:0, pending:0};
      openDisc.forEach(function(d) {
        const pend = d.pending || 0;
        if (d.aging_bucket && BUCKETS.indexOf(d.aging_bucket) > -1) {
          bktTotals[d.aging_bucket].count++;
          bktTotals[d.aging_bucket].pending += pend;
        } else {
          noDateTot.count++;
          noDateTot.pending += pend;
        }
      });

      // Resolution metrics — success rate uses resolved-only (rejected don't count as wins)
      const successRate  = Math.round(resolvedDisc.length / allDisc.length * 100);
      const withTime     = closedDisc.filter(function(d) { return d.days_to_close != null; });
      const avgClose     = withTime.length > 0
        ? Math.round(withTime.reduce(function(s,d) { return s + d.days_to_close; }, 0) / withTime.length) : null;
      const openWithDays = openDisc.filter(function(d) { return d.days_open != null && d.days_open >= 0; });
      const avgOpen      = openWithDays.length > 0
        ? Math.round(openWithDays.reduce(function(s,d) { return s + d.days_open; }, 0) / openWithDays.length) : null;
      // Resolved vs rejected breakdown for progress bar — use closedDisc as base so bar aligns with labels
      const resolvedPct  = closedDisc.length > 0 ? Math.round(resolvedDisc.length / closedDisc.length * 100) : 0;

      // Per-channel unified data (single pass)
      const chData = {};
      allDisc.forEach(function(d) {
        if (!chData[d.channel]) {
          chData[d.channel] = {bkts:{}, no_date:{count:0,pending:0}, total:0, closed:0, tSum:0, tCnt:0, openArr:[]};
          BUCKETS.forEach(function(b) { chData[d.channel].bkts[b] = {count:0,pending:0}; });
        }
        const c    = chData[d.channel];
        const pend = d.pending || 0;
        c.total++;
        if (d.is_closed) {
          c.closed++;
          if (d.days_to_close != null) { c.tSum += d.days_to_close; c.tCnt++; }
        } else {
          if (d.aging_bucket && BUCKETS.indexOf(d.aging_bucket) > -1) {
            c.bkts[d.aging_bucket].count++;
            c.bkts[d.aging_bucket].pending += pend;
          } else {
            c.no_date.count++;
            c.no_date.pending += pend;
          }
          if (d.days_open != null && d.days_open >= 0) c.openArr.push(d.days_open);
        }
      });

      // ── Action Summary Row (3 cards) ──────────────────────────────────
      const hasAging = BUCKETS.some(function(b) { return bktTotals[b].count > 0; });
      const inProgressCount   = BUCKETS.reduce(function(s,b) { return s + bktTotals[b].count; }, 0);
      const inProgressPending = BUCKETS.reduce(function(s,b) { return s + bktTotals[b].pending; }, 0);
      const resolvedActual    = resolvedDisc.reduce(function(s,d) { return s + (d.actual_reimbursed||0); }, 0);

      // ── Aging chips for In Progress card ──────────────────────────────
      const agingChips = BUCKETS.map(function(b, i) {
        const cnt = bktTotals[b].count;
        const bg  = cnt > 0 ? (i === 0 ? '#e8f5e9' : i === 1 ? '#fff8e1' : i === 2 ? '#fff3e0' : '#ffebee') : '#f5f5f5';
        const col = cnt > 0 ? BKT_COLORS[i] : '#ccc';
        return '<div style="flex:1;background:' + bg + ';border-radius:8px;padding:6px 8px;text-align:center">' +
          '<div style="font-size:16px;font-weight:800;color:' + col + '">' + cnt + '</div>' +
          '<div style="font-size:9px;color:' + col + ';font-weight:600;margin-top:1px">' + BKT_LABELS[i].replace(' days','d').replace(' Days','d') + '</div>' +
        '</div>';
      }).join('');

      const actionSummaryRow =
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">' +

        // Needs Action
        '<div style="background:#fff5f5;border-radius:12px;padding:16px;border:1px solid #ffcdd2;border-left:5px solid #c62828">' +
          '<div style="font-size:10px;font-weight:700;color:#c62828;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">🔴 Needs Action</div>' +
          '<div style="font-size:32px;font-weight:800;color:#c62828;line-height:1">' + noDateTot.count + '</div>' +
          '<div style="font-size:11px;color:#888;margin-top:4px">cases — no case raised yet</div>' +
          '<div style="font-size:14px;font-weight:700;color:#c62828;margin-top:10px">' + formatUSD(noDateTot.pending) + '</div>' +
          '<div style="font-size:10px;color:#888">pending recovery</div>' +
        '</div>' +

        // In Progress — with aging chips inside
        '<div style="background:#fffbf0;border-radius:12px;padding:16px;border:1px solid #ffe0b2;border-left:5px solid #e65100">' +
          '<div style="font-size:10px;font-weight:700;color:#e65100;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">🟡 In Progress</div>' +
          '<div style="font-size:32px;font-weight:800;color:#e65100;line-height:1">' + inProgressCount + '</div>' +
          '<div style="font-size:11px;color:#888;margin-top:4px">cases — being chased</div>' +
          '<div style="font-size:14px;font-weight:700;color:#e65100;margin-top:10px">' + formatUSD(inProgressPending) + '</div>' +
          '<div style="font-size:10px;color:#888;margin-bottom:10px">pending recovery</div>' +
          '<div style="display:flex;gap:5px;margin-top:8px;border-top:1px solid #ffe0b2;padding-top:10px">' + agingChips + '</div>' +
        '</div>' +

        // Resolved
        '<div style="background:#f0fdf4;border-radius:12px;padding:16px;border:1px solid #c8e6c9;border-left:5px solid #2e7d32">' +
          '<div style="font-size:10px;font-weight:700;color:#2e7d32;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">✅ Resolved</div>' +
          '<div style="font-size:32px;font-weight:800;color:#2e7d32;line-height:1">' + (resolvedDisc.length + rejectedDisc.length) + '</div>' +
          '<div style="font-size:11px;color:#888;margin-top:4px">' + resolvedDisc.length + ' recovered · ' + rejectedDisc.length + ' rejected</div>' +
          '<div style="font-size:14px;font-weight:700;color:#2e7d32;margin-top:10px">' + formatUSD(resolvedActual) + '</div>' +
          '<div style="font-size:10px;color:#888">total recovered</div>' +
        '</div>' +
        '</div>';

      const agingRowHTML = '';

      // 3-metric summary row
      const metricRow =

          <i class="fas fa-paper-plane"></i> Send Report Email Now
        </button>
      </div>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  // ── Chart 1: Lost by Channel per Month (channel view)
  if (showChannel && document.getElementById('channelLostChart')) {
    chartInstances.c1 = new Chart(document.getElementById('channelLostChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: months,
        datasets: Object.entries(channels).map(([name, rows]) => ({
          label: name,
          data: rows.map(r => r.lost_stock || 0),
          backgroundColor: (colors[name] || '#666') + 'cc',
          borderColor: colors[name] || '#666',
          borderWidth: 1, borderRadius: 4
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12 } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 } } }
        }
      }
    });
  }

  // ── Chart: Cases Raised — Monthly Trend
  if (document.getElementById('caseTrendChart')) {
    const disc = (data.discrepancies || []).filter(d => d.case_raise_date);
    // Build ordered month buckets from the filtered months list
    const caseCounts = {};
    months.forEach(m => { caseCounts[m] = 0; });
    disc.forEach(d => {
      // Parse case_raise_date into "Month YYYY" label
      const raw = d.case_raise_date;
      let label = null;
      const parts = raw.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (parts) {
        const [, a, b, y] = parts;
        const yr = y.length === 2 ? '20' + y : y;
        // Try dd/mm/yyyy first then mm/dd/yyyy
        const dayFirst = new Date(`${yr}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`);
        const dt = isNaN(dayFirst) ? new Date(`${yr}-${a.padStart(2,'0')}-${b.padStart(2,'0')}`) : dayFirst;
        if (!isNaN(dt)) {
          label = dt.toLocaleString('en-US', { month: 'long' }) + ' ' + dt.getFullYear();
        }
      }
      if (label && caseCounts.hasOwnProperty(label)) caseCounts[label]++;
    });
    const caseLabels = months;
    const caseData = months.map(m => caseCounts[m] || 0);
    const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#1b3a2d';
    chartInstances.caseTrend = new Chart(document.getElementById('caseTrendChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: caseLabels,
        datasets: [{
          label: 'Cases Raised',
          data: caseData,
          borderColor: primaryColor,
          backgroundColor: primaryColor + '18',
          borderWidth: 2.5,
          pointBackgroundColor: primaryColor,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.parsed.y} case${ctx.parsed.y !== 1 ? 's' : ''} raised`
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { beginAtZero: true, grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 }, stepSize: 1 } }
        }
      }
    });
  }

  // ── Chart 2: Loss Distribution Donut (channel view)
  if (showChannel && document.getElementById('lossDistChart')) {
    const totByChannel = Object.entries(channels).map(([name, rows]) => ({
      name, total: rows.reduce((s, r) => s + (r.lost_stock || 0), 0)
    })).filter(c => c.total > 0);
    const grandTotal = totByChannel.reduce((s, c) => s + c.total, 0);
    chartInstances.c2 = new Chart(document.getElementById('lossDistChart').getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: totByChannel.map(c => c.name),
        datasets: [{ data: totByChannel.map(c => c.total), backgroundColor: totByChannel.map(c => colors[c.name] || '#666'), borderWidth: 2, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        cutout: '68%'
      }
    });
    // Custom right-side legend
    const legendEl = document.getElementById('lossDistLegend');
    if (legendEl) {
      legendEl.innerHTML = totByChannel.map(c => {
        const pct = grandTotal > 0 ? (c.total / grandTotal * 100).toFixed(1) : 0;
        const col = colors[c.name] || '#666';
        return `
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:11px;height:11px;border-radius:50%;background:${col};flex-shrink:0"></div>
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap">${c.name}</div>
              <div style="font-size:10px;color:var(--text-muted)">${formatNum(c.total)} units</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:14px;font-weight:800;color:${col}">${pct}%</div>
              <div style="font-size:10px;color:var(--text-muted)">of total</div>
            </div>
          </div>`;
      }).join(`<div style="height:1px;background:var(--border-light);margin:2px 0"></div>`);
    }
  }

  // ── Chart 3: Recovery by Month (channel view)
  if (showChannel && document.getElementById('recoveryChart')) {
    const grandRows = cd.grand_total || [];
    chartInstances.c3 = new Chart(document.getElementById('recoveryChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: months,
        datasets: [
          { label: 'Expected ($)', data: grandRows.map(r => r.expected_reimburs || 0), backgroundColor: '#ff8f0066', borderColor: '#e65100', borderWidth: 1, borderRadius: 4 },
          { label: 'Recovered ($)', data: grandRows.map(r => r.actual_reimbursed || 0), backgroundColor: '#2e7d3266', borderColor: '#2e7d32', borderWidth: 1, borderRadius: 4 },
          { label: 'Recovery Rate (%)', type: 'line', data: grandRows.map(r => r.expected_reimburs > 0 ? +((r.actual_reimbursed / r.expected_reimburs * 100).toFixed(1)) : 0),
            yAxisID: 'y2', borderColor: '#7c3aed', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 4, tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12 } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 }, callback: v => '$' + v } },

  // ── Chart 4: Transporter Lost (bar)

      },
      options: {

        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 } } },
          y: { grid: { display: false }, ticks: { font: { size: 11 } } }

  // ── Chart 5: Transporter Distribution Donut (carrier-only view)

// ── Export ─────────────────────────────────────────────────────────────────

function exportDashboard() {
  if (!_rawData) return;
  const filtered = applyFilters(_rawData);
  const cd = filtered.channel_data;
  const td = filtered.transporter_data;
  const months = cd.months || [];
  const channels = cd.channels || {};
  const transporters = td.transporters || {};
  const date = new Date().toISOString().slice(0, 10);
  const wb = XLSX.utils.book_new();

  // Sheet 1: Channel Summary (one row per month×channel)
  const chRows = [['Month', 'Channel', 'Qty Sent', 'Lost Stock', 'Expected ($)', 'Recovered ($)', 'Pending ($)']];
  months.forEach((m, i) => {
    Object.entries(channels).forEach(([ch, rows]) => {
      const r = rows[i] || {};
      const pending = (r.expected_reimburs || 0) - (r.actual_reimbursed || 0);
      if ((r.qty_sent || 0) > 0 || (r.lost_stock || 0) > 0)
        chRows.push([m, ch, r.qty_sent || 0, r.lost_stock || 0, r.expected_reimburs || 0, r.actual_reimbursed || 0, +pending.toFixed(2)]);
    });
  });
  const wsChannel = XLSX.utils.aoa_to_sheet(chRows);
  wsChannel['!cols'] = [14, 12, 10, 10, 14, 14, 12].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, wsChannel, 'Channel Summary');

  // Sheet 2: Transporter Summary
  const trRows = [['Transporter', 'Total Shipped', 'Total Lost', 'Loss %']];
  Object.entries(transporters).forEach(([name, rows]) => {
    const shipped = rows.reduce((s, r) => s + (r.qty_sent || 0), 0);
    const lost    = rows.reduce((s, r) => s + (r.lost_stock || 0), 0);
    if (shipped > 0 || lost > 0)
      trRows.push([name, shipped, lost, shipped > 0 ? +((lost / shipped * 100).toFixed(2)) : 0]);
  });
  const wsTr = XLSX.utils.aoa_to_sheet(trRows);
  wsTr['!cols'] = [20, 14, 12, 10].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, wsTr, 'Transporter Summary');

  XLSX.writeFile(wb, `recon-dashboard-${date}.xlsx`);
}

function exportDiscrepancy() {
  if (!_rawData) return;
  const disc = applyFilters(_rawData).discrepancies || [];
  const date = new Date().toISOString().slice(0, 10);
  const wb   = XLSX.utils.book_new();

  const getCaseStatus = d => {
    if (d.is_closed) return 'Resolved / Archived';
    if (d.case_raise_date) return 'In Progress';
    return 'Needs Action';
  };
  const rows = [
    ['Case Status',
     'Month', 'Shipment AWB', 'IBR / Label', 'Channel', 'Transporter',
     'Product Name', 'Uniware Code', 'Invoice No',
     'Qty Sent', 'Lost Units', 'Expected ($)', 'Recovered ($)', 'Pending ($)',
     'Reimb. Status', 'Case Raise Date', 'Days Open', 'Aging Bucket', 'Remark'],
    ...disc.map(d => [
      getCaseStatus(d),
      d.month, d.awb, d.platform_label, d.channel, d.transporter,
      d.product_name || '', d.uniware_code || '', d.invoice_no || '',
      d.qty_sent, d.lost_stock, d.expected_reimburs, d.actual_reimbursed, d.pending,
      d.reimbursement_status,
      d.case_raise_date || '', d.days_open != null ? d.days_open : '', d.aging_bucket || '',
      d.remark
    ])
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [18, 14, 18, 18, 10, 14, 24, 14, 14, 10, 10, 13, 13, 12, 14, 14, 10, 14, 30].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Discrepancy Shipments');
  XLSX.writeFile(wb, `discrepancy-shipments-${date}.xlsx`);
}

// ── Data loading ───────────────────────────────────────────────────────────

async function loadData() {
  try {
    const res = await fetch('/api/data');
    const json = await res.json();
    if (json.data) {
      _rawData = json.data;
      _lastUpdated = json.last_updated;

      // India→US badge: action needed (pending + in-progress)
      const iusKpis = (_rawData.india_us || {}).kpis || {};
      const iusAction = ((iusKpis.short_grn_pending||{}).count||0) + ((iusKpis.short_grn_progress||{}).count||0);
      const iusBadge = document.getElementById('iusBadge');
      if (iusBadge) { iusBadge.textContent = iusAction; iusBadge.style.display = iusAction > 0 ? 'inline' : 'none'; }

      // US2US badge: pending + in-progress
      const u2Kpis = (_rawData.us2us || {}).kpis || {};
      const u2Action = ((u2Kpis.pending||{}).count||0) + ((u2Kpis.in_progress||{}).count||0);
      const u2Badge = document.getElementById('us2usBadge');
      if (u2Badge) { u2Badge.textContent = u2Action; u2Badge.style.display = u2Action > 0 ? 'inline' : 'none'; }

      // Reset weekly options so they rebuild from fresh data
      _weekOptions = [];

      // Case Health badge: count open cases (have raise date, no close date) across both sources
      const iusRows = (_rawData.india_us || {}).rows || [];
      const u2Rows  = (_rawData.us2us    || {}).rows || [];
      const openIUS = iusRows.filter(r => r.case_raise_date && r.case_raise_date.trim() && (!r.case_close_date   || !r.case_close_date.trim())).length;
      const openU2  = u2Rows.filter( r => r.case_raise_date && r.case_raise_date.trim() && (!r.case_resolve_date || !r.case_resolve_date.trim())).length;
      const totalOpen = openIUS + openU2;
      const chBadge = document.getElementById('caseHealthBadge');
      if (chBadge) { chBadge.textContent = totalOpen; chBadge.style.display = totalOpen > 0 ? 'inline' : 'none'; }

      applyAndRender();
    } else {
      document.getElementById('mainContent').innerHTML =
        '<div class="loading"><p style="color:#c62828">Failed to load data. Check Google Sheets connection.</p></div>';
    }
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      '<div class="loading"><p style="color:#c62828">Error: ' + e.message + '</p>' +
      '<pre style="font-size:10px;text-align:left;margin-top:10px;color:#555;white-space:pre-wrap">' + (e.stack||'no stack') + '</pre></div>';
  }
}

async function refreshData() {
  showToast('Refreshing data...', 'success');
  await fetch('/api/refresh');
  await loadData();
  showToast('Data refreshed!', 'success');
}

async function sendTestEmail() {
  showToast('Sending email...', 'success');
  try {
    const res = await fetch('/api/send-test-email');
    const json = await res.json();
    if (json.status === 'ok') showToast('Email sent successfully!', 'success');
    else showToast('Error: ' + json.message, 'error');
  } catch(e) { showToast('Failed to send email', 'error'); }
}

<script>
let _editRowIndex = null;
let _editAWB = null;

function openEditModal(awb, status, actual, raiseDate, closeDate, remark, lostStock) {
  _editAWB = awb;
  document.getElementById('editModalAWB').textContent = 'AWB: ' + awb;
  document.getElementById('ef_reimbursement_status').value = status || '';
  document.getElementById('ef_lost_stock').value           = lostStock || '';
  document.getElementById('ef_actual_reimbursed').value    = actual || '';
  document.getElementById('ef_case_raise_date').value      = raiseDate || '';
  document.getElementById('ef_case_close_date').value      = closeDate || '';
  document.getElementById('ef_remark').value               = remark || '';
  document.getElementById('editTimingBar').style.display   = 'none';
  // Always reset save button state when opening
  const btn = document.getElementById('editSaveBtn');
  btn.disabled  = false;
  btn.innerHTML = '<i class="fas fa-save"></i> Save to Sheet';
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  _editRowIndex = null;
  _editAWB = null;
}

async function saveEditModal() {
  if (!_editAWB) return;
  const btn     = document.getElementById('editSaveBtn');
  const bar     = document.getElementById('editTimingBar');
  const label   = document.getElementById('editTimingLabel');
  const clock   = document.getElementById('editTimingClock');
  const fill    = document.getElementById('editTimingFill');

  btn.disabled  = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
  bar.style.display = 'block';
  fill.style.width  = '0%';
  label.textContent = 'Writing to Google Sheet...';

  const startMs = Date.now();
  const ticker  = setInterval(() => {
    const elapsed = ((Date.now() - startMs) / 1000).toFixed(1);
    clock.textContent = elapsed + 's';
    // Animate bar up to 90% while waiting
    const pct = Math.min(90, parseFloat(elapsed) * 12);
    fill.style.width = pct + '%';
  }, 100);

  const fields = {
    reimbursement_status: document.getElementById('ef_reimbursement_status').value,
    lost_stock:           document.getElementById('ef_lost_stock').value,
    actual_reimbursed:    document.getElementById('ef_actual_reimbursed').value,
    case_raise_date:      document.getElementById('ef_case_raise_date').value,
    case_close_date:      document.getElementById('ef_case_close_date').value,
    remark:               document.getElementById('ef_remark').value,
  };

  try {
    // Send all changed fields in one batch request → one Sheets write + one refresh
    const changedFields = Object.fromEntries(
      Object.entries(fields).filter(([_, v]) => v !== '' && v !== null && v !== undefined)
    );
    if (Object.keys(changedFields).length === 0) {
      clearInterval(ticker);
      closeEditModal();
      return;
    }
    const res  = await fetch('/api/update-row', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ awb: _editAWB, fields: changedFields })
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message || 'Update failed');
    clearInterval(ticker);
    const totalSec = ((Date.now() - startMs) / 1000).toFixed(1);
    fill.style.width  = '100%';
    fill.style.background = 'linear-gradient(90deg,#166534,#4ade80)';
    clock.textContent = totalSec + 's';
    label.textContent = `✅ Saved in ${totalSec}s — dashboard refreshing...`;
    setTimeout(() => {
      closeEditModal();
      showToast(`Saved to Google Sheet in ${totalSec}s`, 'success');
      loadData();
    }, 1200);
  } catch(e) {
    clearInterval(ticker);
    fill.style.background = '#dc2626';
    label.textContent = '❌ ' + e.message;
    showToast('Error: ' + e.message, 'error');
    btn.disabled  = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Save to Sheet';
  }
}

// Close modal on backdrop click
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});
</script>
</body>
</html>
