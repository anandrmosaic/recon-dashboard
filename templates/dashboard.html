// ── Thu-Thu week helpers ─────────────────────────────────────────────────────
function _weekThursday(d) {
  const day  = d.getDay();                      // 0=Sun … 4=Thu … 6=Sat
  const back = day >= 4 ? day - 4 : day + 3;   // days back to most recent Thursday
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - back);
}

function _wkLabel(thu) {
  const end = new Date(thu);
  end.setDate(end.getDate() + 6);
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const f   = dt => `${dt.getDate()} ${MO[dt.getMonth()]}`;
  const yr  = thu.getFullYear();
  return `Thu ${f(thu)} – Wed ${f(end)} ${yr}`;
}

function _buildWeekOptions(data) {
  const thuSet = new Set();
  ['india_us','us2us'].forEach(src => {
    ((data[src]||{}).rows||[]).forEach(r => {
      ['case_raise_date','case_close_date','case_resolve_date'].forEach(f => {
        const d = _parseDate(r[f]);
        if (d) thuSet.add(_weekThursday(d).getTime());
      });
    });
  });
  _weekOptions = Array.from(thuSet)
    .sort((a,b) => b - a)           // newest first
    .map(ms => ({ thuMs: ms, label: _wkLabel(new Date(ms)) }));
  // Default to first fully-elapsed week (not the current live week)
  const now = Date.now();
  const liveWkStart = _weekThursday(new Date()).getTime();
  const firstPast = _weekOptions.findIndex(w => w.thuMs < liveWkStart);
  _weekIdx = Math.max(0, firstPast);
}

// ── Outcome classifier ───────────────────────────────────────────────────────
function _closeType(r, actKey) {
  const act = r[actKey] || 0;
  const sr  = (r.sub_remark || r.status || r.subbucket || '').toLowerCase();
  if (act > 0)                                                    return 'cash';
  if (/locat|found|stock sent|stock.*receiv|receiv.*stock/.test(sr)) return 'inventory';
  if (/reject|deny|denied|no.*claim/.test(sr))                    return 'rejected';
  return 'other';
}

// ── Main render ──────────────────────────────────────────────────────────────
function renderWeeklyReview(data, lastUpdated) {
  destroyCharts();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + lastUpdated;

  if (_weekOptions.length === 0) _buildWeekOptions(data);

  if (_weekOptions.length === 0) {
    document.getElementById('mainContent').innerHTML =
      '<div class="loading"><p style="color:#888">No case dates found. Fill <em>case_raise_date</em> / <em>case_close_date</em> columns in the sheet.</p></div>';
    return;
  }

  _weekIdx = Math.max(0, Math.min(_weekIdx, _weekOptions.length - 1));
  const selWk     = _weekOptions[_weekIdx];
  const weekStart = new Date(selWk.thuMs);
  const weekEnd   = new Date(selWk.thuMs); weekEnd.setDate(weekEnd.getDate() + 7);

  const src       = _weeklyView === 'india_us' ? (data.india_us||{}) : (data.us2us||{});
  const rows      = src.rows || [];
  const closeKey  = _weeklyView === 'india_us' ? 'case_close_date' : 'case_resolve_date';
  const actKey    = _weeklyView === 'india_us' ? 'actual' : 'recovered';
  const today     = new Date();

  const inWk = ds => { const d = _parseDate(ds); return d && d >= weekStart && d < weekEnd; };

  // ── Core buckets ────────────────────────────────────────────────────────
  const raised      = rows.filter(r => inWk(r.case_raise_date));
  const closed      = rows.filter(r => inWk(r[closeKey]));
  const noDates     = rows.filter(r => (!r.case_raise_date||!r.case_raise_date.trim()) && (!r[closeKey]||!r[closeKey].trim())).length;

  // Unique label sets for counts
  const raisedLbls  = new Set(raised.map(r => r.label||r.from_label||r.awb||''));
  const closedLbls  = new Set(closed.map(r => r.label||r.from_label||r.awb||''));
  const raisedCount = raisedLbls.size;
  const closedCount = closedLbls.size;

  // Recovery totals
  const recovTotal  = closed.reduce((s,r) => s + (r[actKey]||0), 0);
  const raisedExp   = raised.reduce((s,r) => s + (r.expected||0), 0);

  // Closed same-week vs prior
  const closedSame  = closed.filter(r => inWk(r.case_raise_date));
  const closedPrior = closed.filter(r => { const d=_parseDate(r.case_raise_date); return d && d < weekStart; });
  const recovSame   = closedSame.reduce( (s,r) => s+(r[actKey]||0), 0);
  const recovPrior  = closedPrior.reduce((s,r) => s+(r[actKey]||0), 0);

  // Still pending (raised this week, not yet closed)
  const stillOpen   = raised.filter(r => !r[closeKey]||!r[closeKey].trim());
  const pendingAmt  = stillOpen.reduce((s,r) => s+(r.expected||0), 0);

  // ── Close outcome split ─────────────────────────────────────────────────
  const outcomeSeen = new Set();
  const outcomes    = { cash:0, inventory:0, rejected:0, other:0, cashAmt:0, invAmt:0 };
  closed.forEach(r => {
    const lbl = r.label||r.from_label||r.awb||'';
    if (outcomeSeen.has(lbl)) return;
    outcomeSeen.add(lbl);
    const t = _closeType(r, actKey);
    outcomes[t]++;
    if (t === 'cash')      outcomes.cashAmt += (r[actKey]||0);
    if (t === 'inventory') outcomes.invAmt  += (r.expected||0);
  });

  // ── Channel breakdown ───────────────────────────────────────────────────
  const chMap = {};
  const pushCh = (r, isRaised, isClosed) => {
    const ch  = r.channel || (_weeklyView === 'us2us' ? r.to_channel : r.from_channel) || '—';
    const lbl = r.label   || r.from_label   || r.awb || Math.random()+'';
    if (!chMap[ch]) chMap[ch] = { rl:new Set(), cl:new Set(), raised:0, closed:0, recovered:0, expected:0 };
    if (isRaised && !chMap[ch].rl.has(lbl)) { chMap[ch].rl.add(lbl); chMap[ch].raised++; chMap[ch].expected+=(r.expected||0); }
    if (isClosed && !chMap[ch].cl.has(lbl)) { chMap[ch].cl.add(lbl); chMap[ch].closed++; chMap[ch].recovered+=(r[actKey]||0); }
  };
  raised.forEach(r => pushCh(r, true, false));
  closed.forEach(r => pushCh(r, false, true));
  const sortedChs = Object.entries(chMap).sort((a,b) => (b[1].raised+b[1].closed)-(a[1].raised+a[1].closed));

  // ── Claims Bucket for selected week (India→US, week-filtered) ────────────
  const wkCBAgg = { rec:0, prog:0, pend:0 };
  rows.filter(r => inWk(r.case_raise_date) || inWk(r[closeKey])).forEach(r => {
    // Check both Sub Remark and Remarks (AJ) columns — write keyword in either
    const sl = ((r.sub_remark || '') + ' ' + (r.remarks || '')).toLowerCase().trim();
    // Bucket 1: actual > 0 means money was received — use actual regardless of sub_remark
    if ((r.actual || 0) > 0) {
      wkCBAgg.rec  += r.actual   || 0;
    // Bucket 2: Claim raised, pending receipt
    } else if (sl.includes('claim raised but not received') ||
               sl.includes('claim raised but pending')      ||
               sl.includes('claim submitted')               ||
               sl.includes('claim filed')                   ||
               sl.includes('case raised')                   ||
               sl.includes('under review')                  ||
               sl.includes('claim in progress')             ||
               sl.includes('raised')                        ||
               (sl.includes('raised') && sl.includes('claim'))) {
      wkCBAgg.prog += r.expected || 0;
    // Bucket 3: Pending to claim (no claim filed yet)
    } else if (sl.includes('pending') || sl.includes('to be claimed')) {
      wkCBAgg.pend += r.expected || 0;
    }
    // rows outside claim scope excluded
  });
  const wkCBGrand = wkCBAgg.rec + wkCBAgg.prog + wkCBAgg.pend;

  // ── Aged cases closed this week (prior vintage only) ───────────────────
  const agedSeen  = new Set();
  const agedCases = closedPrior
    .filter(r => { const lbl=r.label||r.from_label||r.awb||''; if(agedSeen.has(lbl)) return false; agedSeen.add(lbl); return true; })
    .map(r => {
      const rd = _parseDate(r.case_raise_date);
      const cd = _parseDate(r[closeKey]);
      const age = rd ? Math.round((cd ? cd : today) - rd) / 86400000 : null;
      return { ...r, age: age ? Math.round(age) : null };
    })
    .sort((a,b) => (b.age||0) - (a.age||0))
    .slice(0, 20);

  // ── Helpers ─────────────────────────────────────────────────────────────
  const chColors  = ['#1565c0','#c2185b','#00897b','#7b1fa2','#e65100','#2e7d32','#795548','#455a64'];
  const tgl = a => a
    ? 'background:#1b3a2d;color:#fff;border-color:#1b3a2d'
    : 'background:#fff;color:#555;border-color:#dee2e6';

  const weekOpts = _weekOptions.map((w,i) =>
    `<option value="${i}"${i===_weekIdx?' selected':''}>${w.label}</option>`
  ).join('');

  // ── Channel table rows ──────────────────────────────────────────────────
  const chRows = sortedChs.map(([ch,d], idx) => {
    const rate = d.raised > 0 ? Math.round((d.closed/d.raised)*100) : null;
    const rc   = rate==null?'#aaa':rate>=80?'#2e7d32':rate>=40?'#e65100':'#c62828';
    return `<tr style="${idx%2===1?'background:#f9fafb':''}">
      <td style="padding:9px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px">
        <div style="width:8px;height:8px;border-radius:50%;background:${chColors[idx%chColors.length]};flex-shrink:0"></div>${ch}
      </td>
      <td style="padding:9px 14px;text-align:right;font-weight:700;color:#1565c0;font-size:14px;font-variant-numeric:tabular-nums">${d.raised||'—'}</td>
      <td style="padding:9px 14px;text-align:right;font-weight:700;color:#2e7d32;font-size:14px;font-variant-numeric:tabular-nums">${d.closed||'—'}</td>
      <td style="padding:9px 14px;text-align:right;font-weight:700;color:#2e7d32;font-size:13px;font-variant-numeric:tabular-nums">${d.recovered>0?formatUSD(d.recovered):'<span style="color:#ccc">—</span>'}</td>
      <td style="padding:9px 14px;text-align:right;color:#888;font-size:13px;font-variant-numeric:tabular-nums">${d.expected>0?formatUSD(d.expected):'<span style="color:#ccc">—</span>'}</td>
      <td style="padding:9px 14px;text-align:right">
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">
          <div style="width:50px;height:4px;background:#e9ecef;border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${rate||0}%;background:${rc};border-radius:2px"></div>
          </div>
          <span style="font-size:12px;font-weight:700;color:${rc};font-variant-numeric:tabular-nums">${rate!=null?rate+'%':'—'}</span>
        </div>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" style="text-align:center;padding:24px;color:#aaa">No cases with dates in this week</td></tr>`;

  const totR=sortedChs.reduce((s,[,d])=>s+d.raised,0);
  const totC=sortedChs.reduce((s,[,d])=>s+d.closed,0);
  const totRec=sortedChs.reduce((s,[,d])=>s+d.recovered,0);
  const totExp=sortedChs.reduce((s,[,d])=>s+d.expected,0);
  const totRate=totR>0?Math.round((totC/totR)*100):null;
  const totRc=totRate==null?'#888':totRate>=80?'#2e7d32':totRate>=40?'#e65100':'#c62828';

  // ── Aged cases table rows ───────────────────────────────────────────────
  const agedRows = agedCases.map((r,i) => {
    const ac = r.age||0;
    const acC= ac>90?'#7b1fa2':ac>60?'#c62828':ac>30?'#e65100':'#2e7d32';
    const t  = _closeType(r, actKey);
    const outcomeTag = t==='cash'
      ? `<span style="background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">💰 Cash</span>`
      : t==='inventory'
      ? `<span style="background:#e3f2fd;color:#1565c0;border:1px solid #90caf9;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">📦 Inventory</span>`
      : t==='rejected'
      ? `<span style="background:#ffebee;color:#c62828;border:1px solid #ef9a9a;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">❌ Rejected</span>`
      : `<span style="background:#f5f5f5;color:#888;border:1px solid #ddd;padding:2px 7px;border-radius:10px;font-size:10px">— Other</span>`;
    return `<tr style="${i%2===1?'background:#f9fafb':''}">
      <td style="padding:8px 14px;font-size:11px;color:#666">${r.month||'—'}</td>
      <td style="padding:8px 14px;font-size:11px;font-weight:600;color:#1b3a2d">${r.label||r.from_label||'—'}</td>
      <td style="padding:8px 14px;font-size:11px;color:#888">${r.case_raise_date||'—'}</td>
      <td style="padding:8px 14px;text-align:center">
        <span style="background:${acC}18;color:${acC};padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700">${ac}d old</span>
      </td>
      <td style="padding:8px 14px;text-align:center">${outcomeTag}</td>
      <td style="padding:8px 14px;text-align:right;font-size:12px;font-weight:700;color:#2e7d32;font-variant-numeric:tabular-nums">${r[actKey]>0?formatUSD(r[actKey]):'<span style="color:#ccc">—</span>'}</td>
      <td style="padding:8px 14px;font-size:10px;color:#777;max-width:160px;word-break:break-word">${r.sub_remark||r.status||r.subbucket||'—'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;padding:20px;color:#aaa">No prior-vintage cases closed this week</td></tr>`;

// ── Internal US 2 US Tab ───────────────────────────────────────────────────
let _u2Filter = { month: '', channel: '', carrier: '' };
let _u2Tab    = 'all'; // 'all' | 'closed' | 'pending' | 'progress' | 'intransit'

function renderUS2USTab(data, lastUpdated) {
  destroyCharts();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + lastUpdated;

  const u2      = (data.us2us) || {};
  const kpis    = u2.kpis    || {};
  const rows    = u2.rows    || [];
  const monthly = u2.monthly || {};
  const months  = u2.months  || [];

  const closed   = kpis.closed      || {};
  const transit  = kpis.intransit   || {};
  const pending  = kpis.pending     || {};
  const progress = kpis.in_progress || {};

  // Badges
  const actionNeeded = (pending.count||0) + (progress.count||0);
  const badge = document.getElementById('us2usBadge');
  if (badge) { badge.textContent = actionNeeded; badge.style.display = actionNeeded > 0 ? 'inline' : 'none'; }

  const MONTH_ORDER = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const sortedMonths = months.slice().sort((a,b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b));

  const totalCount     = (closed.count||0) + (transit.count||0) + (pending.count||0) + (progress.count||0);
  const totalExpected  = (pending.expected||0) + (progress.expected||0);
  const totalRecovered = (closed.recovered||0) + (progress.recovered||0);

  // Unique TO channels for filter dropdown (destination = who we raise claim with)
  const allChannels = [...new Set(rows.map(r => r.to_channel))].filter(Boolean).sort();

  // Base filter (month + to_channel)
  const baseFilter = function(r) {
    return (!_u2Filter.month   || r.month      === _u2Filter.month) &&
           (!_u2Filter.channel || r.to_channel === _u2Filter.channel);
  };

  // Unique carriers (for Closed tab filter)
  const allCarriers = [...new Set(rows.filter(function(r) { return r.bucket_key === 'closed'; }).map(function(r) { return r.carrier; }))].filter(Boolean).sort();

  // Row sets per bucket
  const closedRows   = rows.filter(function(r) {
    return r.bucket_key === 'closed' && baseFilter(r) &&

function renderIndiaUSTab(data, lastUpdated) {
  destroyCharts();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + lastUpdated;

  const ius     = (data.india_us) || {};
  const kpis    = ius.kpis    || {};
  const rows    = ius.rows    || [];
  const monthly = ius.monthly || {};
  const months  = ius.months  || [];

  const closed   = kpis.closed             || {};
  const transit  = kpis.intransit          || {};
  const pending  = kpis.short_grn_pending  || {};
  const progress = kpis.short_grn_progress || {};

  // Update badge
  const actionNeeded = (pending.count || 0) + (progress.count || 0);
  const badge = document.getElementById('iusBadge');
  if (badge) { badge.textContent = actionNeeded; badge.style.display = actionNeeded > 0 ? 'inline' : 'none'; }

  // Sort months by year then month name (handles multi-year data)
  const MONTH_ORDER = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const sortedMonths = months.slice().sort((a, b) => {
    const [am, ay] = a.split(' '); const [bm, by] = b.split(' ');
    const yd = parseInt(ay||0) - parseInt(by||0);
    return yd !== 0 ? yd : MONTH_ORDER.indexOf(am) - MONTH_ORDER.indexOf(bm);
  });

  // Helper: "January 2026" → Date object
  const monthToDate = (ms) => {
    if (!ms) return null;
    const p = ms.split(' '); const mi = MONTH_ORDER.indexOf(p[0]);
    return (mi >= 0 && p[1]) ? new Date(parseInt(p[1]), mi, 1) : null;
  };

  // Helper: days since YYYY-MM-DD string
  const daysSince = (ds) => {
    if (!ds || ds === '—') return null;
    const d = _parseDate(ds);
    return d ? Math.floor((Date.now() - d.getTime()) / 86400000) : null;
  };

  // Helper: colour-coded age chip
  const ageChip = (days) => {
    if (days === null || days === undefined) return '<span style="color:#aaa;font-size:10px">—</span>';
    if (days >= 90) return '<span style="background:#fce4ec;color:#c62828;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap">⚠️ ' + days + 'd</span>';
    if (days >= 30) return '<span style="background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap">⏰ ' + days + 'd</span>';
    return '<span style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap">' + days + 'd</span>';
  };

  // Financials
  const totalExpected  = (closed.expected||0) + (pending.expected||0) + (progress.expected||0);
  const totalRecovered = (closed.actual||0)   + (progress.actual||0);
  const totalPending   = Math.max(0, totalExpected - totalRecovered);
  const recovRate      = totalExpected > 0 ? ((totalRecovered / totalExpected) * 100).toFixed(1) : '0.0';
  const totalCount     = (closed.count||0) + (transit.count||0) + (pending.count||0) + (progress.count||0);

  // Parent → child IBR map
  const childrenOf = {};
  rows.forEach(r => { if (r.old_ibr) { if (!childrenOf[r.old_ibr]) childrenOf[r.old_ibr] = []; childrenOf[r.old_ibr].push(r.label); } });

  // Base filter
  const baseFilter = r =>
    (!_iusFilter.month   || r.month   === _iusFilter.month) &&
    (!_iusFilter.channel || r.channel === _iusFilter.channel);

  // Sub-tab row sets
  const baseClosedRows     = rows.filter(r => r.bucket_key === 'closed' && baseFilter(r));
  const allTransporters    = [...new Set(baseClosedRows.map(r => r.transporter))].filter(Boolean).sort();
  const allResolutions     = [...new Set(baseClosedRows.map(r => r.sub_remark))].filter(Boolean).sort();
  const closedRows         = baseClosedRows.filter(r =>
    (!_iusFilter.transporter || r.transporter === _iusFilter.transporter) &&
    (!_iusFilter.resolution  || r.sub_remark  === _iusFilter.resolution));
  const pendingRows        = rows.filter(r => r.bucket_key === 'short_grn_pending' && baseFilter(r));
  const progressRows       = rows.filter(r => (r.bucket_key === 'short_grn_progress' || r.bucket_key === 'short_grn_awaiting_ibr') && baseFilter(r));
  const transitRows        = rows.filter(r => r.bucket_key === 'intransit' && baseFilter(r));

  // Sorted oldest-first (highest urgency at top)
  const pendingRowsSorted  = pendingRows.slice().sort((a, b) => {
    const da = monthToDate(a.month), db = monthToDate(b.month);
    if (!da && !db) return (b.expected||0)-(a.expected||0);
    return !da ? 1 : !db ? -1 : da-db;
  });
  const progressRowsSorted = progressRows.slice().sort((a, b) => {
    const da = a.case_raise_date ? _parseDate(a.case_raise_date) : monthToDate(a.month);
    const db = b.case_raise_date ? _parseDate(b.case_raise_date) : monthToDate(b.month);
    if (!da && !db) return (b.expected||0)-(a.expected||0);
    return !da ? 1 : !db ? -1 : da-db;
  });

  // All distinct channels across ALL rows (shown in every tab's filter bar)
  const allChannels = [...new Set(rows.map(r => r.channel))].filter(Boolean).sort();

  // Reusable filter bar
  const filterBar = (tabId, srcRows) => {
    const fM = [...new Set(srcRows.map(r => r.month))].filter(Boolean);
    const mOpts = fM.map(m => '<option value="' + m + '"' + (_iusFilter.month===m?' selected':'') + '>' + m + '</option>').join('');
    const cOpts = allChannels.map(c => '<option value="' + c + '"' + (_iusFilter.channel===c?' selected':'') + '>' + c + '</option>').join('');
    return '<div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.018);flex-wrap:wrap">' +
      '<span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">Filter:</span>' +
      '<select onchange="_iusFilter.month=this.value;_iusTab=\'' + tabId + '\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)"><option value="">All Months</option>' + mOpts + '</select>' +
      '<select onchange="_iusFilter.channel=this.value;_iusTab=\'' + tabId + '\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)"><option value="">All Channels</option>' + cOpts + '</select>' +
      '<button onclick="_iusFilter={month:\'\',bucket:\'\',channel:\'\'};_iusTab=\'' + tabId + '\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600">✕ Clear</button>' +
    '</div>';
  };

  // Closed-tab specific filter bar (Month + Channel + Carrier + Resolution)
  const iusClosedFilterBar = () => {
    const mOpts = [...new Set(baseClosedRows.map(r => r.month))].filter(Boolean).map(m => '<option value="' + m + '"' + (_iusFilter.month===m?' selected':'') + '>' + m + '</option>').join('');
    const cOpts = allChannels.map(c => '<option value="' + c + '"' + (_iusFilter.channel===c?' selected':'') + '>' + c + '</option>').join('');
    const tOpts = allTransporters.map(t => '<option value="' + t + '"' + (_iusFilter.transporter===t?' selected':'') + '>' + t + '</option>').join('');
    const rOpts = allResolutions.map(r => '<option value="' + r + '"' + (_iusFilter.resolution===r?' selected':'') + '>' + r + '</option>').join('');
    const hasFilter = _iusFilter.month || _iusFilter.channel || _iusFilter.transporter || _iusFilter.resolution;
    return '<div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.018);flex-wrap:wrap">' +
      '<span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">Filter:</span>' +
      '<select onchange="_iusFilter.month=this.value;_iusTab=\'closed\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" title="Filter by shipment month"><option value="">All Months</option>' + mOpts + '</select>' +
      '<select onchange="_iusFilter.channel=this.value;_iusTab=\'closed\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" title="Filter by destination sales channel"><option value="">All Channels</option>' + cOpts + '</select>' +
      '<select onchange="_iusFilter.transporter=this.value;_iusTab=\'closed\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" title="Filter by shipping carrier"><option value="">All Carriers</option>' + tOpts + '</select>' +
      '<select onchange="_iusFilter.resolution=this.value;_iusTab=\'closed\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" title="Filter by how the case was resolved"><option value="">All Resolution Types</option>' + rOpts + '</select>' +
      (hasFilter ? '<span style="font-size:10px;color:#1565c0;font-weight:700">● Filtered</span>' : '') +
      '<button onclick="_iusFilter={month:\'\',bucket:\'\',channel:\'\',transporter:\'\',resolution:\'\'};_iusTab=\'closed\';renderIndiaUSTab(_rawData,_lastUpdated)" style="font-size:11px;padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600">✕ Clear All</button>' +
    '</div>';
  };

  // Reusable mini stats bar
  const statsBar = (items) => {
    const cells = items.map((s, i) => {
      const br = i < items.length-1 ? 'border-right:1px solid var(--border);' : '';
      const bg = s.bg ? 'background:' + s.bg + ';' : '';
      const vc = s.bg ? s.c : 'var(--muted)';
      return '<div style="flex:1;padding:11px 14px;text-align:center;' + br + bg + '">' +
        '<div style="font-size:17px;font-weight:800;color:' + s.c + ';font-variant-numeric:tabular-nums">' + s.v + '</div>' +
        '<div style="font-size:10px;color:' + vc + ';margin-top:2px;text-transform:uppercase;letter-spacing:.4px">' + s.l + '</div>' +
        (s.d ? '<div style="font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3">' + s.d + '</div>' : '') +
        '</div>';
    }).join('');
    return '<div style="display:flex;border-bottom:1px solid var(--border)">' + cells + '</div>';
  };

  // ── TAB BUILDERS ────────────────────────────────────────────────────────

  const buildAllTab = () => {
    const mRows = sortedMonths.map(m => {
      const mv = monthly[m] || {};
      const rate = mv.expected > 0 ? ((mv.actual||0)/mv.expected*100).toFixed(0)+'%' : '—';
      const rc = mv.expected > 0 && (mv.actual||0)/mv.expected >= 0.5 ? '#2e7d32' : '#e65100';
      const ms = (m.split(' ')[0]||'').slice(0,3)+' '+(m.split(' ')[1]||'');
      return '<tr>' +
        '<td style="padding:7px 12px;font-weight:600;font-size:11px">' + ms + '</td>' +
        '<td style="padding:7px 8px;text-align:center;color:#2e7d32;font-weight:600;font-size:11px">' + (mv.closed||0) + '</td>' +
        '<td style="padding:7px 8px;text-align:center;color:#1565c0;font-weight:600;font-size:11px">' + (mv.intransit||0) + '</td>' +
        '<td style="padding:7px 8px;text-align:center;color:#c62828;font-weight:600;font-size:11px">' + (mv.short_grn_pending||0) + '</td>' +
        '<td style="padding:7px 8px;text-align:center;color:#e65100;font-weight:600;font-size:11px">' + (mv.short_grn_progress||0) + '</td>' +
        '<td style="padding:7px 12px;text-align:right;font-size:11px">' + formatUSD(mv.expected||0) + '</td>' +
        '<td style="padding:7px 12px;text-align:right;color:#2e7d32;font-weight:600;font-size:11px">' + formatUSD(mv.actual||0) + '</td>' +
        '<td style="padding:7px 8px;text-align:right;font-weight:700;font-size:11px;color:' + rc + '">' + rate + '</td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="8" style="text-align:center;padding:20px;color:#888">No data</td></tr>';

    return '<div style="display:grid;grid-template-columns:3fr 2fr;gap:14px;padding:15px">' +
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden">' +
        '<div style="padding:9px 13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">📅 Monthly Breakdown</span>' +
          '<span style="font-size:10px;color:var(--muted)">' + sortedMonths.length + ' months</span>' +
        '</div>' +
        '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums">' +
          '<thead><tr style="background:linear-gradient(135deg,#1b3a2d,#2d5a3d)">' +
            '<th style="padding:7px 12px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:left">Month</th>' +
            '<th style="padding:7px 8px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:center">✅ Closed</th>' +
            '<th style="padding:7px 8px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:center">🚚 Transit</th>' +
            '<th style="padding:7px 8px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:center">🔴 Pending</th>' +
            '<th style="padding:7px 8px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:center">⏳ Prog.</th>' +
            '<th style="padding:7px 12px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:right">Expected</th>' +
            '<th style="padding:7px 12px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:right">Recovered</th>' +
            '<th style="padding:7px 8px;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;text-align:right">Rate</th>' +
          '</tr></thead>' +
          '<tbody>' + mRows + '</tbody>' +
          '<tfoot><tr style="background:rgba(27,58,45,.06);border-top:2px solid var(--border)">' +
            '<td style="padding:7px 12px;font-weight:700;font-size:11px;color:#1b3a2d">TOTAL</td>' +
            '<td style="padding:7px 8px;text-align:center;color:#2e7d32;font-weight:700;font-size:11px">' + (closed.count||0) + '</td>' +
            '<td style="padding:7px 8px;text-align:center;color:#1565c0;font-weight:700;font-size:11px">' + (transit.count||0) + '</td>' +
            '<td style="padding:7px 8px;text-align:center;color:#c62828;font-weight:700;font-size:11px">' + (pending.count||0) + '</td>' +
            '<td style="padding:7px 8px;text-align:center;color:#e65100;font-weight:700;font-size:11px">' + (progress.count||0) + '</td>' +
            '<td style="padding:7px 12px;text-align:right;font-weight:700;font-size:11px">' + formatUSD(totalExpected) + '</td>' +
            '<td style="padding:7px 12px;text-align:right;color:#2e7d32;font-weight:700;font-size:11px">' + formatUSD(totalRecovered) + '</td>' +
            '<td style="padding:7px 8px;text-align:right;color:#2e7d32;font-weight:700;font-size:11px">' + recovRate + '%</td>' +
          '</tr></tfoot>' +
        '</table></div>' +
      '</div>' +
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:9px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">💰 Financial Summary</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<div style="padding:10px;background:#fff3e0;border-radius:9px;border:1px solid #ffe0b2;text-align:center"><div style="font-size:15px;font-weight:800;color:#e65100;font-variant-numeric:tabular-nums">' + formatUSD(totalExpected) + '</div><div style="font-size:10px;color:#e65100;margin-top:2px;text-transform:uppercase;letter-spacing:.4px">Expected</div></div>' +
          '<div style="padding:10px;background:#e8f5e9;border-radius:9px;border:1px solid #c8e6c9;text-align:center"><div style="font-size:15px;font-weight:800;color:#2e7d32;font-variant-numeric:tabular-nums">' + formatUSD(totalRecovered) + '</div><div style="font-size:10px;color:#2e7d32;margin-top:2px;text-transform:uppercase;letter-spacing:.4px">Recovered</div></div>' +
          '<div style="padding:10px;background:#fce4ec;border-radius:9px;border:1px solid #f8bbd0;text-align:center"><div style="font-size:15px;font-weight:800;color:#c62828;font-variant-numeric:tabular-nums">' + formatUSD(totalPending) + '</div><div style="font-size:10px;color:#c62828;margin-top:2px;text-transform:uppercase;letter-spacing:.4px">Pending</div></div>' +
          '<div style="padding:10px;background:#e3f2fd;border-radius:9px;border:1px solid #bbdefb;text-align:center"><div style="font-size:15px;font-weight:800;color:#1565c0;font-variant-numeric:tabular-nums">' + recovRate + '%</div><div style="font-size:10px;color:#1565c0;margin-top:2px;text-transform:uppercase;letter-spacing:.4px">Recovery Rate</div></div>' +
        '</div>' +
        '<div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px"><span>Progress</span><span style="font-weight:700;color:#2e7d32">' + recovRate + '%</span></div>' +
          '<div style="background:var(--border);border-radius:5px;height:7px;overflow:hidden"><div style="height:100%;width:' + Math.min(parseFloat(recovRate),100) + '%;background:linear-gradient(90deg,#1b5e20,#43a047);border-radius:5px"></div></div></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<div style="text-align:center;padding:9px;background:rgba(0,0,0,.03);border-radius:8px;border:1px solid var(--border)"><div style="font-size:15px;font-weight:800;color:#558b2f;font-variant-numeric:tabular-nums">' + ((closed.count||0)/Math.max(totalCount,1)*100).toFixed(1) + '%</div><div style="font-size:10px;color:var(--muted);margin-top:2px">Close Rate</div></div>' +
          '<div style="text-align:center;padding:9px;background:#fce4ec;border-radius:8px;border:1px solid #f8bbd0"><div style="font-size:15px;font-weight:800;color:#c62828;font-variant-numeric:tabular-nums">' + actionNeeded + '</div><div style="font-size:10px;color:#c62828;margin-top:2px">Need Action ⚠️</div></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  };

  const buildClosedTab = () => {
    // ── Filtered stats ───────────────────────────────────────────────────────
    let totRec = 0, totExp = 0, totDays = 0, daysCount = 0, totQty = 0, totDiff = 0;
    let totCarrierRec = 0, totChannelRec = 0, carrierCount = 0, channelCount = 0;
    closedRows.forEach(r => {
      totRec  += r.actual   || 0;
      totExp  += r.expected || 0;
      totQty  += r.qty      || 0;
      totDiff += r.diff     || 0;
      if ((r.carrier_recovered||0) > 0) { totCarrierRec += r.carrier_recovered; carrierCount++; }
      if ((r.channel_recovered||0) > 0) { totChannelRec += r.channel_recovered; channelCount++; }
      if (r.case_raise_date && r.case_close_date) {
        const d1 = _parseDate(r.case_raise_date), d2 = _parseDate(r.case_close_date);
        if (d1 && d2 && d2 >= d1) { totDays += Math.floor((d2-d1)/86400000); daysCount++; }
      }
    });
    const avgDays = daysCount > 0 ? Math.round(totDays / daysCount) : null;
    const diffLabel = totDiff > 0 ? '−'+totDiff.toLocaleString() : totDiff < 0 ? '+'+Math.abs(totDiff).toLocaleString() : '0';
    const diffColor = totDiff > 0 ? '#c62828' : totDiff < 0 ? '#2e7d32' : '#888';

    // Resolution → color map (distinct palette so each type reads clearly)
    const scMap = {
      'Fully Received':                                '#2e7d32',
      'Claim raised and Received':                     '#1565c0',
      'Excess Received':                               '#00695c',
      'Damage received':                               '#546e7a',
      'New IBR/WRO-Received against old IBR/WRO':     '#7b1fa2',
      'Pending qty inwarded against new IBR/WRO':      '#e65100'
    };
    // Inline filter options for the Resolution column header
    const allResOpts = allResolutions.map(r => '<option value="' + r + '" style="background:#1b5e20;color:white"' + (_iusFilter.resolution===r?' selected':'') + '>' + r + '</option>').join('');

    // ── Info banner — helps new users understand what they're looking at ────
    const infoBanner =
      '<div class="ius-banner" style="padding:10px 16px;background:rgba(21,101,192,.06);border-bottom:1px solid rgba(21,101,192,.18);display:flex;gap:10px;align-items:flex-start">' +
        '<span style="font-size:15px;flex-shrink:0;line-height:1.5">ℹ️</span>' +
        '<div>' +
          '<div style="font-size:11px;font-weight:700;color:#1565c0;margin-bottom:3px">About this view — Closed Cases (India → US)</div>' +
          '<div style="font-size:10px;color:var(--muted);line-height:1.75">' +
            'These are shipments where a <strong>quantity discrepancy (short-GRN)</strong> was discovered and the claim was <strong>fully settled</strong> with the carrier. ' +
            'Use the <strong>4 filters above</strong> to narrow by month, sales channel, carrier, or resolution type. ' +
            'Hover any column header for a plain-English description of what that column shows.' +
          '</div>' +
        '</div>' +
      '</div>';

    // ── Case Closed — Resolution Breakdown (card grid) ──────────────────────
    const remarkMap = {};
    closedRows.forEach(r => {
      const k = r.sub_remark || 'Unknown';
      if (!remarkMap[k]) remarkMap[k] = { count:0, amount:0, expected:0 };
      remarkMap[k].count++;
      remarkMap[k].amount   += r.actual   || 0;
      remarkMap[k].expected += r.expected || 0;
    });
    const remarkEntries = Object.entries(remarkMap).sort((a,b) => b[1].count - a[1].count);
    const maxRemark = remarkEntries.length > 0 ? remarkEntries[0][1].count : 1;

    const caseClosedSection = remarkEntries.length > 0 ?
      '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">' +
        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:11px">' +
          '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">✅ How Were These Cases Closed?</span>' +
          '<span style="font-size:10px;color:var(--muted)">' + closedRows.length + ' total · click a card to filter</span>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">' +
        remarkEntries.map(([k, v], idx) => {
          const sc = scMap[k] || '#2e7d32';
          const pct = closedRows.length > 0 ? (v.count/closedRows.length*100).toFixed(0) : '0';
          const barW = Math.round(v.count / maxRemark * 100);

// ── Shared UPS date parser (used by both UPS tab and India→US overview) ────
function _parseUpsDate(s) {
  if (!s || s === '—') return null;
  let d = new Date(s); if (!isNaN(d)) return d;
  const m1 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m1) return new Date(+m1[3], +m1[2]-1, +m1[1]);
  const m2 = s.match(/^(\d{1,2})[\/\-]([A-Za-z]+)[\/\-](\d{4})$/);
  if (m2) return new Date(m2[2]+' '+m2[1]+', '+m2[3]);
  return null;
}
