<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Inventory Reconciliation</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#eef3f7; color:#173b2c; }
    .login-card { width:min(390px, calc(100vw - 32px)); padding:30px; background:#fff; border:1px solid #dfe7e2; border-radius:16px; box-shadow:0 12px 30px rgba(16,50,37,.12); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:11px; background:#173f2e; color:#fff; font-weight:800; letter-spacing:.5px; }
    h1 { margin:0; font-size:20px; }
    .subtitle { margin:5px 0 24px; color:#6b7b73; font-size:13px; }
    label { display:block; margin:14px 0 6px; font-size:12px; font-weight:700; color:#42564c; }
    input { width:100%; padding:11px 12px; border:1px solid #cbd8d0; border-radius:8px; font-size:14px; }
    input:focus { outline:2px solid #9cc8b0; border-color:#357451; }
    button { width:100%; margin-top:22px; padding:12px; border:0; border-radius:8px; background:#173f2e; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
    button:hover { background:#245942; }
    .error { padding:10px 12px; border-radius:8px; background:#fff0ef; color:#b42318; font-size:12px; }
    .footnote { margin:18px 0 0; color:#8a9890; font-size:11px; text-align:center; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><div class="brand-mark">RL</div><div><h1>Inventory Reconciliation</h1><div class="subtitle" style="margin:3px 0 0">India → USA Shipment Tracker</div></div></div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="footnote">Authorized users only</p>
  </main>
</body>
</html>
